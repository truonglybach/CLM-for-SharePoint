[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-for-sharepoint"
version = "0.1.0"
description = "Contract Lifecycle Management pipeline on SharePoint with AI-assisted extraction via Azure OpenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "msal>=1.28,<2",
    "requests>=2.31,<3",
    "openai>=1.40,<3",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17,<2"]
ocr = ["pymupdf>=1.24", "python-docx>=1.1", "pytesseract>=0.3.10", "Pillow>=10"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
clm-process-contract = "clm.process_contract:main"
clm-process-amendment = "clm.process_amendment:main"
clm-provision-lists = "clm.provision_lists:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "W"]
# E701/E702: the orchestrators use a compact one-line style; keep it.
ignore = ["E701", "E702"]
